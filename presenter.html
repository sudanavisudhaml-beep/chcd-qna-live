<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Presenter — CHCD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#eef1f6; --card:#ffffff; --ink:#14171c; --muted:#6b7280; --line:#e6e9ef;
      --brand:#2f6bff; --brand-ink:#1f4fd0; --brand-soft:#eaf1ff;
      --love:#e0245e; --love-soft:#fdeef3; --ok:#16a34a; --ok-soft:#e7f6ec;
      --radius:20px; --shadow:0 6px 24px rgba(20,40,80,.08); --shadow-sm:0 2px 10px rgba(20,40,80,.06);
    }
    *{box-sizing:border-box} html,body{margin:0}
    body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 50% -200px,#dfe7ff 0%,var(--bg) 60%);color:var(--ink);
      line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
    .wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}

    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 20px}
    .head h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
    .head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
    .head a{color:var(--brand-ink);font-size:.82rem;font-weight:600;text-decoration:none;border:1.5px solid var(--line);
      background:var(--card);padding:7px 13px;border-radius:999px;white-space:nowrap}
    .head a:hover{background:var(--brand-soft)}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .banner{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:14px;padding:12px 14px;font-size:.86rem;margin-bottom:16px}
    label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 6px}
    .lbl-field{margin:12px 0 6px}
    textarea,input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;
      font:inherit;color:var(--ink);background:#fbfcfe;transition:border-color .15s,box-shadow .15s;resize:vertical}
    textarea{min-height:74px}
    textarea:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);background:#fff}

    .btn{appearance:none;border:none;cursor:pointer;background:var(--brand);color:#fff;font:inherit;font-weight:700;
      padding:11px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(47,107,255,.32);transition:transform .05s,background .15s}
    .btn:hover{background:var(--brand-ink)} .btn:active{transform:translateY(1px)}
    .btn.small{padding:8px 15px;font-size:.84rem}
    .btn.ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line);box-shadow:none;font-weight:600}
    .btn.ghost:hover{background:var(--bg);color:var(--ink)}
    .btn.ghost.danger{color:#c0392b} .btn.ghost.danger:hover{background:#fdeceb}
    .btn.secondary{background:#fff;color:var(--brand-ink);border:1.5px solid var(--brand);box-shadow:none}
    .btn.secondary:hover{background:var(--brand-soft)}

    .stats{display:flex;gap:10px;margin-bottom:14px}
    .stat{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;box-shadow:var(--shadow-sm)}
    .stat .n{font-size:1.6rem;font-weight:800;color:var(--brand-ink);font-variant-numeric:tabular-nums}
    .stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:2px}

    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .toolbar .grow{flex:1}

    #list{display:flex;flex-direction:column;gap:14px}
    .post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px}
    .post-head{display:flex;gap:11px;align-items:center;margin-bottom:10px}
    .avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:1rem;box-shadow:var(--shadow-sm)}
    .avatar.sm{width:30px;height:30px;font-size:.8rem}
    .cname{font-weight:700;font-size:.92rem}
    .ctime{font-size:.78rem;color:var(--muted)}
    .qtext{font-size:1.05rem;line-height:1.5;word-wrap:break-word}
    .badge{font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;display:inline-block}
    .badge.answered{background:var(--ok-soft);color:var(--ok)} .badge.new{background:#fff3df;color:#b9760c}
    .row-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

    .replies{margin-top:12px;padding-left:14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
    .reply{display:flex;gap:10px;align-items:flex-start}
    .reply-body{flex:1;min-width:0} .reply .ctext{font-size:.9rem;word-wrap:break-word}

    .empty{text-align:center;color:var(--muted);padding:40px 16px}
    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;
      font-size:.9rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}

    /* Mode proyektor */
    body.projector{background:#0b1f3a;color:#fff}
    body.projector .wrap{max-width:1100px}
    body.projector .post,body.projector .stat{background:#11294a;border-color:#1d3a63}
    body.projector .qtext{font-size:1.6rem} body.projector .cname{font-size:1.1rem}
    body.projector .ctime,body.projector .muted,body.projector label{color:#9db4d4}
    body.projector .reply .ctext{font-size:1.05rem;color:#cfe0f5}
    body.projector .replies{border-left-color:#1d3a63}
    body.projector .stat .n{color:#6db3ff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div><h1>Panel Presenter</h1><p id="subtitle">CHCD</p></div>
      <a href="index.html" target="_blank">Halaman audience ↗</a>
    </div>

    <div class="card" id="gate">
      <label for="pin">Masukkan PIN Presenter</label>
      <input type="password" id="pin" placeholder="PIN" />
      <div style="margin-top:12px"><button class="btn" id="unlock">Buka Panel</button></div>
    </div>

    <div id="panel" style="display:none">
      <div id="warn"></div>
      <div class="stats">
        <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Pertanyaan</div></div>
        <div class="stat"><div class="n" id="sReact">0</div><div class="l">Reaksi</div></div>
        <div class="stat"><div class="n" id="sReply">0</div><div class="l">Balasan</div></div>
        <div class="stat"><div class="n" id="sOpen">0</div><div class="l">Belum dijawab</div></div>
      </div>
      <div class="toolbar">
        <button class="btn ghost small" id="filterBtn">Tampil: Semua</button>
        <button class="btn ghost small" id="projBtn">Mode Proyektor</button>
        <div class="grow"></div>
        <button class="btn secondary small" id="exportBtn">⬇ Export Notulen (CSV)</button>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>App.initPresenter();</script>
</body>
</html>
