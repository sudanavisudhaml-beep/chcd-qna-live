<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUERY — Panel Presenter</title>
  <link rel="icon" type="image/png" href="query-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --astra:#005BAA; --astra-dark:#00417c; --astra-light:#95B6DF; --astra-soft:#e9f2fb; --astra-soft2:#f3f8fd;
      --ink:#0f1b2d; --muted:#65728a; --line:#e3e9f1; --card:#ffffff;
      --love:#e0245e; --ok:#16a34a; --ok-soft:#e7f6ec;
      --radius:22px; --shadow:0 10px 34px rgba(0,71,140,.10); --shadow-sm:0 3px 12px rgba(0,71,140,.07);
    }
    *{box-sizing:border-box} html,body{margin:0}
    body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
      background:#f6f9fc;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

    .nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--line)}
    .nav-in{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .astra-logo{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:1.32rem;letter-spacing:.02em;color:var(--astra);text-decoration:none}
    .astra-logo .mk{width:13px;height:13px;border-radius:3px;background:linear-gradient(135deg,var(--astra),var(--astra-light));transform:rotate(45deg)}
    .astra-img{height:30px;width:auto;display:block}
    .astra-logo .astra-fallback{display:none;align-items:center;gap:9px}
    .foot .astra-img{height:26px}
    .verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:9px;font-weight:900;margin-left:5px;vertical-align:middle}
    .av-wrap{position:relative;flex-shrink:0}
    .av-check{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;line-height:1}
    .nav a.link{color:var(--astra-dark);font-size:.8rem;font-weight:700;text-decoration:none;border:2px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;white-space:nowrap}
    .nav a.link:hover{background:var(--astra-soft)}

    .wrap{max-width:780px;margin:0 auto;padding:16px 16px 40px;width:100%;flex:1}
    .ptitle{margin:6px 2px 16px} .ptitle h1{margin:0;font-size:1.5rem;font-weight:900;letter-spacing:-.02em} .ptitle p{margin:2px 0 0;color:var(--muted);font-size:.88rem}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .banner{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:16px;padding:13px 15px;font-size:.86rem;margin-bottom:16px}
    label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:0 0 6px} .lbl-field{margin:12px 0 6px}
    textarea,input[type=text],input[type=password]{width:100%;border:2px solid var(--line);border-radius:16px;padding:13px 15px;font:inherit;color:var(--ink);background:var(--astra-soft2);transition:border-color .15s,box-shadow .15s}
    textarea{min-height:74px}
    textarea:focus,input:focus{outline:none;border-color:var(--astra);box-shadow:0 0 0 4px var(--astra-soft);background:#fff}

    .btn{appearance:none;border:none;cursor:pointer;background:var(--astra);color:#fff;font:inherit;font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 6px 18px rgba(0,91,170,.32);transition:transform .08s,background .15s}
    .btn:hover{background:var(--astra-dark)} .btn:active{transform:translateY(1px)}
    .btn.small{padding:9px 16px;font-size:.84rem}
    .btn.ghost{background:#fff;color:var(--muted);border:2px solid var(--line);box-shadow:none;font-weight:700} .btn.ghost:hover{background:var(--astra-soft2);color:var(--ink)}
    .btn.ghost.danger{color:#c0392b} .btn.ghost.danger:hover{background:#fdeceb}
    .btn.secondary{background:#fff;color:var(--astra-dark);border:2px solid var(--astra);box-shadow:none} .btn.secondary:hover{background:var(--astra-soft)}

    .stats{display:flex;gap:10px;margin-bottom:14px}
    .stat{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 8px;box-shadow:var(--shadow-sm)}
    .stat .n{font-size:1.7rem;font-weight:900;color:var(--astra);font-variant-numeric:tabular-nums}
    .stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:2px}

    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px} .toolbar .grow{flex:1}

    #list{display:flex;flex-direction:column;gap:14px}
    .post{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-sm);padding:18px 20px}
    .post-head{display:flex;gap:11px;align-items:center;margin-bottom:10px}
    .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1rem;box-shadow:var(--shadow-sm)}
    .avatar.sm{width:30px;height:30px;font-size:.8rem}
    .cname{font-weight:800;font-size:.93rem} .ctime{font-size:.78rem;color:var(--muted)}
    .qtext{font-size:1.06rem;line-height:1.5;word-wrap:break-word}
    .badge{font-size:.66rem;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;display:inline-block}
    .badge.answered{background:var(--ok-soft);color:var(--ok)} .badge.new{background:#fff3df;color:#b9760c}
    .row-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .replies{margin-top:12px;padding-left:15px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
    .reply{display:flex;gap:10px;align-items:flex-start} .reply-body{flex:1;min-width:0} .reply .ctext{font-size:.9rem;word-wrap:break-word}

    .empty{text-align:center;color:var(--muted);padding:40px 16px}
    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size:.9rem;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}

    .foot{margin-top:auto;border-top:1px solid var(--line);background:#fff}
    .foot-in{max-width:780px;margin:0 auto;padding:22px 16px;text-align:center;color:var(--muted)}
    .foot .astra-logo{font-size:1.05rem;justify-content:center;margin-bottom:6px}
    .foot .credit{font-size:.86rem;font-weight:700;color:var(--ink)} .foot .credit span{color:var(--astra)}
    .foot .sub{font-size:.76rem;margin-top:3px}

    /* Mode proyektor */
    body.projector{background:#08294a;color:#fff}
    body.projector .wrap{max-width:1100px}
    body.projector .post,body.projector .stat{background:#0e3460;border-color:#1c4a82}
    body.projector .qtext{font-size:1.7rem} body.projector .cname{font-size:1.1rem}
    body.projector .ctime,body.projector .muted,body.projector label{color:#a9c6e8}
    body.projector .reply .ctext{font-size:1.05rem;color:#d4e6fb} body.projector .replies{border-left-color:#1c4a82}
    body.projector .stat .n{color:#6db3ff}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-in">
    <a class="astra-logo" href="https://www.astra.co.id/" target="_blank" rel="noopener">
      <img src="astra-logo.png" alt="ASTRA" class="astra-img" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'" />
      <span class="astra-fallback"><span class="mk"></span>ASTRA</span>
    </a>
    <a class="link" href="index.html" target="_blank">Halaman audience ↗</a>
  </div></nav>

  <div class="wrap">
    <div class="ptitle"><h1>Panel Presenter</h1><p id="subtitle">CHCD</p></div>

    <div class="card" id="gate">
      <label for="pin">Masukkan PIN Presenter</label>
      <input type="password" id="pin" placeholder="PIN" />
      <div style="margin-top:12px"><button class="btn" id="unlock">Buka Panel</button></div>
    </div>

    <div id="panel" style="display:none">
      <div id="warn"></div>
      <div class="stats">
        <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Pertanyaan</div></div>
        <div class="stat"><div class="n" id="sReact">0</div><div class="l">Reaksi</div></div>
        <div class="stat"><div class="n" id="sReply">0</div><div class="l">Balasan</div></div>
        <div class="stat"><div class="n" id="sOpen">0</div><div class="l">Belum dijawab</div></div>
      </div>
      <div class="toolbar">
        <button class="btn ghost small" id="filterBtn">Tampil: Semua</button>
        <button class="btn ghost small" id="projBtn">Mode Proyektor</button>
        <div class="grow"></div>
        <button class="btn secondary small" id="exportBtn">⬇ Export Notulen (CSV)</button>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <footer class="foot"><div class="foot-in">
    <div class="credit">Dibuat oleh <span>System Development — GA Department</span></div>
    <div class="sub">© 2026 · PT Astra International Tbk</div>
  </div></footer>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>App.initPresenter();</script>
</body>
</html>
