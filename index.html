<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUERY — Suara Insan Astra</title>
  <link rel="icon" type="image/png" href="query-icon.png?v=3" />
  <link rel="apple-touch-icon" href="query-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --astra:#005BAA; --astra-dark:#00417c; --astra-light:#95B6DF; --astra-soft:#e9f2fb; --astra-soft2:#f3f8fd;
      --ink:#0f1b2d; --muted:#65728a; --line:#e3e9f1; --card:#ffffff;
      --love:#e0245e; --love-soft:#fdeef3; --ok:#16a34a; --ok-soft:#e7f6ec;
      --radius:22px; --shadow:0 10px 34px rgba(0,71,140,.10); --shadow-sm:0 3px 12px rgba(0,71,140,.07);
    }
    *{box-sizing:border-box} html,body{margin:0}
    body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);background:#f6f9fc;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

    .bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
    .blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5}
    .blob.b1{width:260px;height:260px;background:radial-gradient(circle at 30% 30%,#bcd6f5,#e9f2fb);top:-70px;left:-60px}
    .blob.b2{width:180px;height:180px;background:radial-gradient(circle at 30% 30%,#d7e6fa,#f3f8fd);top:120px;right:-50px}
    .blob.b3{width:140px;height:140px;background:radial-gradient(circle at 30% 30%,#cfe0f8,#eef5fd);bottom:60px;left:-40px;opacity:.4}

    .nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--line)}
    .nav-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .astra-logo{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:1.32rem;letter-spacing:.02em;color:var(--astra);text-decoration:none}
    .astra-logo .mk{width:13px;height:13px;border-radius:3px;background:linear-gradient(135deg,var(--astra),var(--astra-light));transform:rotate(45deg)}
    .astra-img{height:30px;width:auto;display:block}
    .astra-logo .astra-fallback{display:none;align-items:center;gap:9px}
    .astra-logo .astra-fallback .mk{width:13px;height:13px;border-radius:3px;background:linear-gradient(135deg,var(--astra),var(--astra-light));transform:rotate(45deg)}
    .nav .nlink{font-size:.8rem;font-weight:700;color:var(--astra-dark);text-decoration:none;border:2px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
    .nav .nlink:hover{background:var(--astra-soft)}

    .wrap{max-width:680px;margin:0 auto;padding:8px 16px 40px;width:100%;flex:1}
    .page{max-width:520px;margin:0 auto;padding:18px 16px 40px;width:100%;flex:1}

    /* Brand kecil di landing/dashboard */
    .brand{text-align:center;margin:22px 0 22px}
    .brand img{height:60px;width:auto}
    .brand .bfallback{display:none;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:2rem;color:var(--astra-dark)}
    .brand .bsub{margin-top:8px;font-size:.92rem;color:var(--muted);font-style:italic;font-weight:600}

    /* Hero QUERY (session) */
    .hero{position:relative;overflow:hidden;text-align:center;color:#fff;margin:22px 0 26px;padding:30px 22px 28px;border-radius:28px;
      background:linear-gradient(155deg,#0a74c8 0%,#005BAA 52%,#00407a 100%);box-shadow:0 18px 44px rgba(0,71,140,.30);
      display:flex;flex-direction:column;align-items:center}
    .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
    .hero::before{width:240px;height:240px;top:-90px;right:-70px}
    .hero::after{width:150px;height:150px;bottom:-70px;left:-40px}
    .hero>*{position:relative;z-index:1}
    .live-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
      border-radius:999px;padding:6px 15px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;backdrop-filter:blur(4px)}
    .dot{width:8px;height:8px;border-radius:50%;background:#ff5a5c;animation:pulse 1.6s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,92,.6)}70%{box-shadow:0 0 0 9px rgba(255,90,92,0)}100%{box-shadow:0 0 0 0 rgba(255,90,92,0)}}
    .logo-card{display:inline-block;background:#fff;border-radius:18px;padding:16px 26px;margin:16px 0 2px;box-shadow:0 12px 28px rgba(0,0,0,.20)}
    .query-logo-img{height:78px;width:auto;max-width:78vw;display:block}
    .hero .tagline{margin:14px 0 0;font-size:1.04rem;font-weight:600;font-style:italic;color:rgba(255,255,255,.95)}
    .hero .event{display:inline-block;margin-top:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);
      padding:9px 22px;border-radius:999px;font-weight:800;font-size:.96rem;letter-spacing:.01em;backdrop-filter:blur(4px)}
    .hero .materi{display:block;margin:11px auto 0;max-width:32ch;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
      padding:8px 18px;border-radius:16px;font-weight:600;font-size:.84rem;line-height:1.35;color:rgba(255,255,255,.96)}

    .verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:9px;font-weight:900;margin-left:5px;vertical-align:middle}
    .av-wrap{position:relative;flex-shrink:0}
    .av-check{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;line-height:1}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .banner{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:16px;padding:13px 15px;font-size:.86rem;margin-bottom:16px}
    .banner code{background:#fde9d3;padding:1px 6px;border-radius:6px;font-size:.82em}

    .composer{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px}
    textarea,input[type=text],input[type=password]{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 15px;font:inherit;
      color:var(--ink);background:var(--astra-soft2);transition:border-color .15s,box-shadow .15s,background .15s;resize:vertical}
    textarea{min-height:80px}
    textarea:focus,input:focus{outline:none;border-color:var(--astra);box-shadow:0 0 0 4px var(--astra-soft);background:#fff}
    .composer-foot{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .composer-foot input{flex:1 1 100%;padding:12px 14px;border-radius:999px}
    .composer-foot .btn{margin-left:auto}
    .counter{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
    .field-err{display:none;color:#e0245e;font-size:.82rem;font-weight:700;margin:8px 2px 0}

    .btn{appearance:none;border:none;cursor:pointer;background:var(--astra);color:#fff;font:inherit;font-weight:800;
      padding:13px 26px;border-radius:999px;box-shadow:0 6px 18px rgba(0,91,170,.35);transition:transform .08s,box-shadow .15s,background .15s}
    .btn:hover{background:var(--astra-dark);box-shadow:0 8px 22px rgba(0,91,170,.45);transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
    .btn.small{padding:9px 17px;font-size:.85rem}
    .btn.block{width:100%;justify-content:center;display:flex}
    .btn.ghost{background:#fff;color:var(--muted);border:2px solid var(--line);box-shadow:none;font-weight:700}
    .btn.ghost:hover{background:var(--astra-soft2);color:var(--ink);transform:none}
    .btn.ghost.danger{color:#c0392b} .btn.ghost.danger:hover{background:#fdeceb}

    .bar{display:flex;align-items:center;gap:10px;margin:6px 6px 16px}
    .bar h2{font-size:1.1rem;margin:0;font-weight:800}
    .bar .cnt{color:var(--muted);font-weight:700;font-size:.95rem}
    .bar .grow{flex:1}

    .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.02rem;box-shadow:var(--shadow-sm)}
    .avatar.sm{width:30px;height:30px;font-size:.8rem}

    #list{display:flex;flex-direction:column;gap:15px}
    .post{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-sm);padding:18px 20px;transition:box-shadow .18s,transform .18s}
    .post:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
    .post-head{display:flex;gap:11px;align-items:center;margin-bottom:10px}
    .cname{font-weight:800;font-size:.93rem}
    .ctime{font-size:.76rem;color:var(--muted)}
    .qtext{font-size:1.08rem;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
    .badge{font-size:.66rem;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;display:inline-block}
    .badge.answered{background:var(--ok-soft);color:var(--ok)} .badge.new{background:#fff3df;color:#b9760c}

    .answerbox{margin-top:12px;padding:13px 15px;background:var(--astra-soft);border-radius:16px;border-left:4px solid var(--astra)}
    .answerbox .lbl{font-size:.7rem;font-weight:800;color:var(--astra-dark);text-transform:uppercase;letter-spacing:.04em}
    .answerbox .txt{font-size:.98rem;margin-top:3px;white-space:pre-wrap;word-wrap:break-word}

    .actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
    .act{appearance:none;cursor:pointer;font:inherit;font-size:.86rem;font-weight:700;background:#fff;
      border:2px solid var(--line);color:var(--muted);padding:9px 17px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
      box-shadow:0 2px 6px rgba(0,71,140,.05);transition:transform .12s,box-shadow .12s,border-color .12s,background .12s}
    .act b{color:var(--ink);font-variant-numeric:tabular-nums}
    .act:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 14px rgba(0,71,140,.14);border-color:#cfe0f5}
    .act:active{transform:translateY(0) scale(.97)}
    .act.on.like{color:#fff;border-color:var(--astra);background:linear-gradient(135deg,var(--astra),#2f8ad6);box-shadow:0 6px 16px rgba(0,91,170,.4)}
    .act.on.like b{color:#fff}
    .act.admin{border-style:dashed;color:var(--astra-dark);border-color:#bcd6f5;background:var(--astra-soft2)}
    .act.admin.danger{color:#c0392b;border-color:#f1b6b1;background:#fdf1f0}

    .answer-edit{margin-top:13px;background:var(--astra-soft2);border:1px solid var(--line);border-radius:16px;padding:13px}
    .answer-edit textarea{background:#fff}
    .fmt-bar{display:flex;gap:6px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
    .fmt{appearance:none;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink);width:36px;height:32px;border-radius:9px;font:inherit;font-size:.98rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
    .fmt:hover{background:var(--astra-soft2);border-color:#cfe0f5}
    .fmt-hint{font-size:.72rem;color:var(--muted);font-family:ui-monospace,monospace}
    .answerbox .txt strong,.qtext strong,.ctext strong{font-weight:800}
    .answerbox .txt em,.qtext em,.ctext em{font-style:italic}
    .row-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

    .replies{margin-top:14px;padding-left:15px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
    .reply{display:flex;gap:10px;align-items:flex-start}
    .reply-body{flex:1;min-width:0} .reply .ctext{font-size:.9rem;margin-top:1px;word-wrap:break-word;white-space:pre-wrap}
    .reply-composer{display:flex;gap:8px;align-items:center}
    .reply-composer input{flex:1;padding:10px 14px;border-radius:999px}

    .empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:.95rem}

    /* ===== Auth / Landing ===== */
    .seg{display:flex;background:var(--astra-soft2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
    .seg button{flex:1;border:none;background:transparent;font:inherit;font-weight:800;color:var(--muted);padding:10px;border-radius:999px;cursor:pointer}
    .seg button.active{background:#fff;color:var(--astra);box-shadow:var(--shadow-sm)}
    label.fld{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:12px 0 6px}
    .hintline{font-size:.78rem;color:var(--muted);margin-top:7px}
    h3.sec{font-size:1.06rem;margin:0 0 4px;font-weight:800}
    .center{text-align:center} .muted{color:var(--muted)}
    .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.06em;margin:20px 0;text-transform:uppercase}
    .divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
    .code-input input{text-align:center;font-family:ui-monospace,monospace;font-weight:800;letter-spacing:.3em;font-size:1.2rem;text-transform:uppercase}

    /* ===== Dashboard ===== */
    .dash-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 18px}
    .dash-head .hi{font-size:1.2rem;font-weight:800}
    .dash-head .hi small{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-top:1px}
    .ev-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:13px}
    .ev-card .en{font-weight:800;font-size:1.04rem;line-height:1.3}
    .ev-card .em{font-size:.85rem;color:var(--muted);margin-top:3px}
    .ev-code{display:inline-block;margin-top:10px;font-family:ui-monospace,monospace;font-weight:800;letter-spacing:.16em;background:var(--astra-soft);color:var(--astra-dark);padding:6px 13px;border-radius:9px;font-size:.98rem}
    .ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
    .share-box{margin-top:13px;padding:14px;border:1px dashed #bcd6f5;background:var(--astra-soft2);border-radius:14px;text-align:center;display:none}
    .share-box.open{display:block}
    .share-box img{width:172px;height:172px;background:#fff;border-radius:10px;padding:6px}
    .share-box .lnk{font-size:.76rem;color:var(--astra-dark);word-break:break-all;margin-top:9px;font-weight:600}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--astra-dark);font-weight:800;font-size:.85rem;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;margin:2px 0 12px}

    /* ===== Kuesioner: builder & form ===== */
    select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:var(--astra-soft2);color:var(--ink)}
    select:focus{outline:none;border-color:var(--astra);background:#fff}
    .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;color:var(--muted)}
    .chk input{width:auto}
    .qfield{margin-bottom:18px} .qfield:last-child{margin-bottom:0}
    .qflabel{font-weight:700;margin-bottom:6px;font-size:.98rem}
    .qfdesc{font-size:.83rem;color:var(--muted);margin:0 0 10px;white-space:pre-wrap;line-height:1.4}
    .opts{display:flex;flex-direction:column;gap:8px}
    .opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-weight:600;background:#fff}
    .opt:hover{border-color:#cfe0f5;background:var(--astra-soft2)}
    .opt input{width:auto;margin:0}
    .rate-row{display:flex;gap:8px}
    .rate{flex:1;height:48px;border:2px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:800;font-size:1.1rem;color:var(--muted);cursor:pointer}
    .rate:hover{border-color:#cfe0f5}
    .rate.on{background:linear-gradient(135deg,var(--astra),#2f8ad6);color:#fff;border-color:var(--astra)}

    /* ===== Hasil kuesioner ===== */
    .stats{display:flex;gap:10px}
    .stat{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;box-shadow:var(--shadow-sm)}
    .stat .n{font-size:1.7rem;font-weight:900;color:var(--astra-dark);font-variant-numeric:tabular-nums}
    .stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:2px}
    .summary .sumlist{margin:8px 0 0;padding-left:20px} .summary .sumlist li{margin:5px 0;font-size:.92rem;line-height:1.45}
    .rf .rf-q{font-weight:800;font-size:1rem}
    .rf .rf-avg{font-size:1.8rem;font-weight:900;color:var(--astra-dark);margin-bottom:10px} .rf .rf-avg span{font-size:1rem;color:var(--muted)}
    .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
    .barrow .blabel{width:34%;font-size:.85rem;font-weight:600;word-break:break-word}
    .barrow .bar{flex:1;height:14px;background:var(--astra-soft);border-radius:999px;overflow:hidden}
    .barrow .bar .fill{height:100%;background:linear-gradient(90deg,var(--astra),#2f8ad6);border-radius:999px;transition:width .3s}
    .barrow .bval{width:78px;text-align:right;font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
    .txtlist{display:flex;flex-direction:column;gap:8px}
    .txtitem{background:var(--astra-soft2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;white-space:pre-wrap;word-wrap:break-word}
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
    .rtbl{border-collapse:collapse;width:100%;font-size:.85rem}
    .rtbl th,.rtbl td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
    .rtbl th{white-space:nowrap;background:var(--astra-soft);color:var(--astra-dark);font-weight:800}
    .rtbl td{min-width:110px;max-width:280px;white-space:pre-wrap;word-wrap:break-word}
    .rtbl .rname{font-weight:700} .rtbl .rtime{color:var(--muted);font-size:.78rem;white-space:nowrap}
    .rtbl tbody tr:nth-child(even){background:#fafcff}

    /* ===== Matriks ===== */
    .mtx-hint{font-size:.78rem;color:var(--muted);margin-bottom:7px}
    .mtx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
    .mtx{border-collapse:collapse;width:100%;font-size:.82rem}
    .mtx th,.mtx td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
    .mtx thead th{background:var(--astra-soft);color:var(--astra-dark);font-weight:800;white-space:nowrap}
    .mtx .mtx-rowh,.mtx .mtx-corner{text-align:left;min-width:190px;max-width:280px;white-space:normal;font-weight:600;background:#fafcff;position:sticky;left:0;z-index:1}
    .mtx .mtx-corner{background:var(--astra-soft);font-weight:800}
    .mtx select{width:62px;padding:6px 4px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700;text-align:center}
    .mtx select:focus{outline:none;border-color:var(--astra)}
    .mtxres td.mtx-avg{font-weight:800;color:var(--astra-dark)}
    .rf-sub{font-weight:800;font-size:.86rem;color:var(--astra-dark);margin:2px 0 8px}
    .mtx thead .grpA{background:var(--astra);color:#fff;font-weight:800;letter-spacing:.02em}
    .mtx thead .grpB{background:#6d34d6;color:#fff;font-weight:800;letter-spacing:.02em}
    .mtx .mo-sel{width:132px;font-weight:700}
    .vtag{font-size:.6rem;font-weight:800;background:#efe7fb;color:#6d34d6;padding:1px 6px;border-radius:999px;vertical-align:middle;margin-left:4px}
    .oitem{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}

    /* ===== Vote — form pemilih ===== */
    .vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .vote-card{appearance:none;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:11px;font:inherit;box-shadow:var(--shadow-sm);transition:transform .1s,border-color .12s,box-shadow .12s}
    .vote-card:hover{border-color:var(--astra);transform:translateY(-2px);box-shadow:var(--shadow)}
    .vote-card:active{transform:scale(.97)}
    .flag-md{width:96px;height:64px;object-fit:cover;border-radius:9px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
    .vc-name{font-weight:800;font-size:1.05rem;text-align:center}
    .flag-sm{width:42px;height:28px;object-fit:cover;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.2);flex-shrink:0}

    /* ===== Vote — layar live (fit-to-screen) ===== */
    .vote-screen{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 700px at 50% -10%,#dfeafc,#f6f9fc 60%);display:flex;flex-direction:column;padding:10px 16px 16px}
    .vs-top{display:flex;align-items:center;gap:14px;padding:6px 2px 10px;flex:0 0 auto}
    .vs-logo{height:56px;width:auto;filter:drop-shadow(0 2px 6px rgba(15,27,45,.15))}
    .vs-mid{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
    .vs-title{font-weight:900;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .vs-pill{background:#e7f6ec;color:#0f7a37;border-color:#b7e4c7}
    .vs-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
    .vs-total{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    .vs-total span{color:var(--astra-dark);font-size:1.1rem}
    .vs-ctrls{display:flex;gap:6px}
    .vs-btn{width:36px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:1rem;box-shadow:var(--shadow-sm)}
    .vs-btn:hover{background:var(--astra-soft2)}
    .vote-screen .share-box.open{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.32);border-style:solid}
    .vs-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
    .vlive-1{grid-template-columns:1fr;grid-template-rows:1fr}
    .vlive-2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
    .vlive-3,.vlive-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
    .vq{min-width:0;min-height:0;background:linear-gradient(160deg,#ffffff,#eef4fb);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;overflow:hidden}
    .vname{font-weight:800;font-size:1.15rem;flex:0 0 auto}
    .vcount{font-weight:900;font-size:1.2rem;color:var(--astra-dark);font-variant-numeric:tabular-nums;flex:0 0 auto}
    .vqflag{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
    /* Bendera pixel: kotak, kosong→terisi pixel demi pixel */
    .pxflag{position:relative;border-radius:8px;overflow:hidden;background:#cfd9e8;box-shadow:0 6px 22px rgba(0,0,0,.14)}
    .pxgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);gap:0}
    .px{position:relative;background:#e9eef6;overflow:hidden}
    .pxfill{position:absolute;inset:0;background-size:1000% 1000%;background-repeat:no-repeat;opacity:0;transform:scale(.55);transition:opacity .4s ease,transform .4s cubic-bezier(.2,1.5,.4,1)}
    .px.on .pxfill{opacity:1;transform:scale(1)}

    /* ===== Tema lapangan bola (World Cup Special Edition) ===== */
    .vs-football{background:
      radial-gradient(circle at 50% 46%, transparent 118px, rgba(255,255,255,.5) 119px, rgba(255,255,255,.5) 123px, transparent 124px),
      linear-gradient(to right, transparent calc(50% - 2px), rgba(255,255,255,.5) calc(50% - 2px), rgba(255,255,255,.5) calc(50% + 2px), transparent calc(50% + 2px)),
      repeating-linear-gradient(90deg, #1e8f43 0 110px, #23a04c 110px 220px);
    }
    /* Liquid glass Apple — skema grey */
    .vs-football .vs-top{background:linear-gradient(160deg,rgba(238,240,244,.62),rgba(222,226,232,.48));backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
      border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:8px 14px;margin-bottom:10px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 28px rgba(15,27,45,.20)}
    .vs-football .vq{background:linear-gradient(165deg,rgba(238,240,244,.55),rgba(220,224,231,.40));backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
      border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px rgba(15,27,45,.16)}
    .vs-football .vq.leader{border:3px solid #ffd166;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 5px rgba(255,209,102,.35),0 10px 30px rgba(15,27,45,.22)}
    .vs-football .vqr-card{background:rgba(245,247,250,.66);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
    .vs-football .wc-fb{background:rgba(245,247,250,.66);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}

    /* Progress bar ala Gantt + animasi wipe */
    .vprog{position:relative;width:86%;max-width:420px;height:27px;border-radius:999px;flex:0 0 auto;overflow:hidden;
      background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 3px rgba(15,27,45,.14)}
    .vprog-fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:999px;overflow:hidden;
      background:linear-gradient(90deg,var(--astra),#2f8ad6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
    .vprog-wipe{position:absolute;top:0;bottom:0;left:-45%;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.7),transparent);animation:vwipe 1.7s linear infinite}
    @keyframes vwipe{0%{left:-45%}100%{left:105%}}
    .vprog-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.94rem;color:var(--astra-dark);
      text-shadow:0 1px 0 rgba(255,255,255,.85),0 0 8px rgba(255,255,255,.6);font-variant-numeric:tabular-nums}

    /* Copyright kecil bawah */
    .vs-copy{flex:0 0 auto;text-align:center;font-size:.6rem;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.78);padding-top:7px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
    .vs-chips{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}

    /* ===== Vote — tema Polymarket (dark, playful) ===== */
    .vs-pm{background:#0a0f1c;color:#eaf0fb;overflow:hidden}
    .pm-orbs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .pm-orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:pmfloat 14s ease-in-out infinite}
    .pm-orbs .o1{width:44vw;height:44vw;background:#f43f5e;top:-14vw;left:-8vw}
    .pm-orbs .o2{width:38vw;height:38vw;background:#3b82f6;bottom:-14vw;right:-6vw;animation-delay:-4s}
    .pm-orbs .o3{width:30vw;height:30vw;background:#f59e0b;top:32%;right:26%;animation-delay:-8s;opacity:.4}
    .pm-orbs .o4{width:26vw;height:26vw;background:#22c55e;bottom:6%;left:22%;animation-delay:-6s;opacity:.35}
    @keyframes pmfloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,-3vw) scale(1.1)}66%{transform:translate(-3vw,3vw) scale(.95)}}
    .vs-pm>*:not(.pm-orbs){position:relative;z-index:1}
    .vs-pm .vs-top{background:rgba(255,255,255,.06);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:8px 14px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
    .vs-pm .vs-logobox{display:inline-flex;border-radius:15px;padding:9px 13px;
      background:linear-gradient(155deg,rgba(240,245,252,.62),rgba(210,224,242,.34));
      backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
      border:1px solid rgba(255,255,255,.55);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -8px 16px rgba(255,255,255,.12),0 10px 26px rgba(0,0,0,.4)}
    .vs-pm .vs-title{color:#fff;font-size:1.4rem}
    .vs-pm .vs-total{color:#9fb2d0} .vs-pm .vs-total span{color:#fff;font-size:1.3rem}
    .vs-pm .vs-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
    .vs-pm .vs-btn:hover{background:rgba(255,255,255,.2)}
    .vs-pm .live-pill{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.4);color:#7ef0a6}

    .pm-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
    .pm-row{flex:1;min-height:0;display:flex;align-items:center;gap:16px;padding:12px 20px 12px 14px;border-radius:20px;
      background:rgba(255,255,255,.055);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
      border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;overflow:hidden;transition:box-shadow .3s,border-color .3s}
    .pm-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,#3b82f6)}
    .pm-row.leader{border-color:rgba(255,209,102,.6);box-shadow:0 0 0 2px rgba(255,209,102,.4),0 12px 34px rgba(0,0,0,.4)}
    .pm-rank{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;color:#0a0f1c;background:rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:background .3s}
    .pm-rank.r1{background:linear-gradient(135deg,#ffe487,#f5a623);box-shadow:0 0 18px rgba(245,166,35,.6)}
    .pm-rank.r2{background:linear-gradient(135deg,#eef2f8,#b7c3d4)}
    .pm-rank.r3{background:linear-gradient(135deg,#f2c58c,#cd7f32)}
    .pm-flag{flex:0 0 clamp(96px,13vw,168px);align-self:stretch;display:flex;align-items:center;justify-content:center;min-height:0}
    .pm-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
    .pm-name{font-weight:800;font-size:1.5rem;color:#fff;display:flex;align-items:center;gap:8px}
    .pm-bar{position:relative;height:22px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
    .pm-bar::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:5px;height:11px;background:rgba(255,255,255,.4);border-radius:0 3px 3px 0}
    .pm-fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:6px;overflow:hidden;background:var(--tc,#3b82f6);box-shadow:0 0 18px var(--tc,#3b82f6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
    .pm-pct{flex:0 0 auto;text-align:right;min-width:104px}
    .pm-numrow{display:flex;align-items:center;justify-content:flex-end;gap:7px}
    .pm-trend{font-size:1.05rem;font-weight:900;color:#7688a6}
    .pm-trend.up{color:#22c55e;text-shadow:0 0 10px rgba(34,197,94,.5)}
    .pm-trend.down{color:#f43f5e;text-shadow:0 0 10px rgba(244,63,94,.5)}
    .pm-num{font-weight:900;font-size:2.4rem;line-height:1;color:var(--tc,#fff);font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.4)}
    .pm-votes{font-size:.82rem;color:#9fb2d0;font-weight:700;margin-top:4px}
    /* ===== Bracket / Kuadran (Final + Perebutan Juara 3) ===== */
    .bkt-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
    .bkt{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:9px 12px 12px;border-radius:20px;
      background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 26px rgba(0,0,0,.3)}
    .bkt-final{border-color:rgba(255,209,102,.42)}
    .bkt-head{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding:0 4px;flex-wrap:wrap}
    .bkt-title{font-weight:900;font-size:1rem;letter-spacing:.07em;text-transform:uppercase;color:#fff}
    .bkt-final .bkt-title{color:#ffe487}
    .bkt-sub{font-size:.72rem;font-weight:800;color:#ffd166;letter-spacing:.02em}
    .bkt-rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
    .bkt .pm-rank{display:none}
    .bkt .pm-row{padding-left:18px}
    .vlead-badge{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:3px 10px;border-radius:999px;
      font-size:.7rem;font-weight:900;letter-spacing:.03em;background:rgba(255,255,255,.16);color:#eaf0fb;animation:none;white-space:nowrap}
    .vlead-badge.win{background:linear-gradient(135deg,#ffe487,#f5a623);color:#5b3b00;box-shadow:0 2px 10px rgba(245,166,35,.5)}
    /* Form bracket: tebak tiap duel */
    .bform-head{font-weight:900;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;color:var(--astra-dark);margin-bottom:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .bform-sub{font-size:.74rem;font-weight:800;color:#f5a623;letter-spacing:.02em;text-transform:none}
    .bform.err{outline:2px solid var(--love);outline-offset:3px}
    .bteam-row{display:flex;align-items:stretch;gap:10px}
    .bteam{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;font:inherit;position:relative;
      background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 10px;transition:transform .16s,border-color .16s,box-shadow .16s}
    .bteam:hover{border-color:var(--astra);transform:translateY(-2px)}
    .bteam-flag{width:78px;height:52px;object-fit:cover;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
    .bteam-name{font-weight:800;font-size:1.05rem;color:var(--ink)}
    .bteam-tick{position:absolute;top:7px;right:9px;width:23px;height:23px;border-radius:50%;background:var(--astra);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:900;opacity:0;transform:scale(.4);transition:.18s}
    .bteam.sel{border-color:var(--astra);background:var(--astra-soft2);box-shadow:0 8px 20px rgba(0,91,170,.26)}
    .bteam.sel .bteam-tick{opacity:1;transform:scale(1)}
    .bvs{align-self:center;flex:0 0 auto;font-weight:900;font-size:.82rem;color:var(--muted);letter-spacing:.06em}
    .vs-pm .vs-copy{color:rgba(255,255,255,.55)}
    /* Panel samping tema dark */
    .vs-pm .wc-fb{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,209,102,.5)}
    .vs-pm .wc-t1{color:#eaf0fb}
    @media(max-width:820px){ .pm-name{font-size:1.15rem} .pm-num{font-size:1.7rem} }
    @media(max-width:680px){
      .vs-pm{overflow-y:auto;padding:8px 9px 12px}
      /* Top bar mobile: kontrol (🔔 ✕) di pojok kanan atas, jumlah vote di bawahnya; logo QUERY di tengah, judul di bawah logo */
      .vs-pm .vs-top{position:relative;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 9px}
      .vs-pm .vs-right{position:absolute;top:8px;right:9px;flex-direction:column-reverse;align-items:flex-end;gap:5px;margin:0}
      .vs-pm .vs-ctrls{gap:5px}
      .vs-pm .vs-total{font-size:.66rem} .vs-pm .vs-total span{font-size:1rem}
      .vs-pm .vs-logobox{order:1;margin-top:2px}
      .vs-pm .vs-mid{order:2;flex-basis:auto;text-align:center;gap:5px}
      .vs-pm .vs-title{font-size:1rem;white-space:normal} .vs-pm .vs-logo{height:30px} .vs-pm .vs-logobox{padding:7px 11px}
      .vs-pm .vs-wc{font-size:.54rem;padding:3px 8px}
      .vs-pm .vs-body{flex-direction:column;gap:10px}
      .vs-pm .pm-list{flex:0 0 auto;gap:9px}
      .vs-pm .pm-row{flex:0 0 auto;min-height:86px;gap:9px;padding:8px 10px 8px 7px;border-radius:14px}
      .vs-pm .pm-rank{width:32px;height:32px;font-size:1rem}
      .vs-pm .pm-flag{flex-basis:70px}
      .vs-pm .pm-name{font-size:1rem} .vs-pm .pm-bar{height:15px} .vs-pm .pm-num{font-size:1.3rem}
      .vs-pm .pm-pct{min-width:68px} .vs-pm .pm-votes{font-size:.66rem} .vs-pm .pm-trend{font-size:.9rem}
      .vs-pm .vs-side{flex:0 0 auto;display:flex;justify-content:center;align-items:stretch}
      .vs-pm .vs-slot{flex:0 0 auto;max-width:230px}
      .vs-pm .vs-slot-wc{display:none}         /* emblem FIFA tidak di panel samping saat mobile */
      .vs-pm .vs-foot{display:flex}            /* emblem FIFA pindah ke tengah bawah (area kosong mobile) */
      .vs-pm .vqr{flex-direction:column;gap:0} .vs-pm .vqr-arrow{display:none}
      .vs-pm .vqr-card{padding:8px 9px} .vs-pm .vqr-title{font-size:.72rem;margin-bottom:4px}
      .vs-pm .vqr-img{width:118px;height:118px} .vs-pm .vqr-sub{font-size:.6rem}
      .vs-pm .vs-foot .wc-img{max-height:min(12vh,104px);max-width:72vw} .vs-pm .wc-date{font-size:.62rem;padding:4px 10px}
      .vs-pm .vs-copy{font-size:.54rem}
    }

    .vs-wc{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#ffd166,#f5a623);color:#5b3b00;font-weight:900;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(245,166,35,.45);white-space:nowrap}
    .vlead{display:none;margin-right:6px;animation:vleadpop 1s infinite alternate}
    @keyframes vleadpop{0%{transform:scale(1)}100%{transform:scale(1.22)}}

    /* Layout: grid + panel QR samping (tidak menutup bendera) */
    .vs-body{flex:1;min-height:0;display:flex;gap:14px}
    .vs-grid{flex:1;min-height:0}
    .vs-side{flex:0 0 196px;display:grid;grid-template-rows:1fr 1fr;gap:20px}
    .vs-slot{display:flex;align-items:center;justify-content:center;min-height:0}
    .vqr{display:flex;flex-direction:column;align-items:center;gap:2px}
    .vqr-arrow{font-size:2rem;animation:vqrbounce 0.9s infinite;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
    /* Emblem World Cup (baris 2 panel) */
    .wc-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;max-width:100%;height:100%}
    .wc-logo{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
    /* Outline putih tipis (keyline gaya stiker) agar logo gelap terbaca di background gelap — bukan kotak, bukan glow */

    .vs-pm .wc-date{color:#ffd166}
    /* Footer emblem WC: HANYA tampil di mobile (desktop pakai posisi lama di bawah QR). PNG transparan, TANPA kotak & TANPA glow, di tengah bawah */
    .vs-foot{display:none;flex:0 0 auto;align-items:center;justify-content:center;padding:6px 0 2px}

    .vs-side .wc-img{max-height:150px}
    .wc-fb{display:none;flex-direction:column;align-items:center;text-align:center;background:#fff;border:3px solid #ffd166;border-radius:18px;padding:14px 18px;box-shadow:0 16px 44px rgba(0,0,0,.30)}
    .wc-ico{font-size:3rem;line-height:1;filter:drop-shadow(0 4px 8px rgba(245,166,35,.5))}
    .wc-t1{font-weight:900;font-size:1.02rem;letter-spacing:.1em;color:var(--astra-dark);margin-top:8px}
